<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>code map · ELK spike</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --card-head: #f8fafc;
    --border: #dde3ea; --text: #1c2430; --muted: #66738a;
    --edge-calls: #2f6fed; --edge-fires: #d97b06; --edge-data: #0e9488;
    --new: #0e9f6e; --sel: #2f6fed;
    --shadow: 0 1px 3px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10151d; --card: #1a212c; --card-head: #1f2836;
      --border: #2c3644; --text: #e6ebf2; --muted: #8b98ac;
      --edge-calls: #6b9bf5; --edge-fires: #f0a13c; --edge-data: #34d0c0;
      --new: #34d399; --sel: #6b9bf5;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    background: var(--card); flex: none;
  }
  #backBtn {
    font: inherit; color: var(--text); background: var(--card-head);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 12px; cursor: pointer;
  }
  #backBtn:hover { border-color: var(--sel); color: var(--sel); }
  #titleBlock { min-width: 0; }
  #mapTitle { font-size: 16px; font-weight: 650; margin: 0; }
  #mapSubtitle { color: var(--muted); font-size: 12px; }
  #mapQuestion { color: var(--muted); font-size: 12px; font-style: italic; }
  #legend { margin-left: auto; display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex: none; align-items: center; }
  .lg { display: inline-flex; align-items: center; gap: 6px; }
  .sw { display: inline-block; width: 22px; height: 0; border-top: 2px solid; }
  .sw-calls { border-color: var(--edge-calls); border-top-style: solid; }
  .sw-fires { border-color: var(--edge-fires); border-top-style: dashed; }
  .sw-data  { border-color: var(--edge-data);  border-top-style: dotted; }
  #tidyBtn {
    font: inherit; color: var(--text); background: var(--card-head);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 12px; cursor: pointer;
  }
  #tidyBtn:hover { border-color: var(--sel); color: var(--sel); }

  main { flex: 1; min-height: 0; position: relative; }
  .view { position: relative; height: 100%; overflow: auto; }
  .stage { position: relative; min-width: 100%; min-height: 100%; }

  svg.edges { position: absolute; top: 0; left: 0; pointer-events: none; }
  svg.edges path { transition: opacity .18s; }
  svg.edges.dim path { opacity: .1; }
  path.edge { fill: none; stroke-width: 1.8; }
  path.e-calls { stroke: var(--edge-calls); }
  path.e-fires { stroke: var(--edge-fires); stroke-dasharray: 7 5; }
  path.e-data  { stroke: var(--edge-data);  stroke-dasharray: 2.5 4.5; }
  path.edge.hot { stroke-width: 3; }
  path.hit { fill: none; stroke: transparent; stroke-width: 11; pointer-events: stroke; }
  .mk-calls { fill: var(--edge-calls); }
  .mk-fires { fill: var(--edge-fires); }
  .mk-data  { fill: var(--edge-data); }

  .layer-label {
    position: absolute; left: 14px;
    font-size: 11px; font-weight: 650; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
    pointer-events: none;
  }

  .mod {
    position: absolute;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: var(--shadow);
    min-width: 190px; max-width: 280px;
    transition: left .25s ease, top .25s ease;
    touch-action: none;
  }
  .mod.dragging {
    transition: none; cursor: grabbing; z-index: 5;
    box-shadow: 0 10px 28px rgba(16,24,40,.28);
  }
  .mod-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; cursor: grab;
    background: var(--card-head); border-radius: 10px 10px 0 0;
  }
  .mod.closed .mod-head { border-radius: 10px; }
  .kind {
    font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); border: 1px solid var(--border);
    border-radius: 5px; padding: 1px 5px; flex: none;
  }
  .mname { font-weight: 650; font-size: 13px; overflow-wrap: anywhere; }
  .focus-btn {
    margin-left: auto; flex: none; cursor: pointer;
    font: 13px/1 system-ui; color: var(--muted);
    background: none; border: 1px solid transparent; border-radius: 6px; padding: 3px 6px;
  }
  .focus-btn:hover { color: var(--sel); border-color: var(--border); }
  [data-tip] { position: relative; }
  [data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute; top: calc(100% + 6px); right: -4px;
    font: 11px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 3px 8px; white-space: nowrap;
    box-shadow: var(--shadow); z-index: 40; pointer-events: none;
  }
  .chev { color: var(--muted); font-size: 10px; flex: none; transition: transform .15s; }
  .chev.open { transform: rotate(90deg); }
  .mod-head:hover .mname { color: var(--sel); }
  .mod-sum { padding: 6px 10px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }
  .fn {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 10px; cursor: pointer;
    border-top: 1px solid var(--border);
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .fn:last-child { border-radius: 0 0 10px 10px; }
  .fn:hover { background: var(--card-head); }
  .fn.sel { outline: 2px solid var(--sel); outline-offset: -2px; }
  .chip-new {
    font: 600 9px/1 system-ui; letter-spacing: .05em; color: #fff;
    background: var(--new); border-radius: 4px; padding: 2px 4px; flex: none;
  }

  .focus-grid {
    display: grid; grid-template-columns: 1fr minmax(260px, 360px) 1fr;
    gap: 56px; padding: 44px 40px 90px; align-items: start;
  }
  .stub-col { display: flex; flex-direction: column; gap: 14px; }
  .stub-col.left { align-items: flex-end; }
  .stub-col.right { align-items: flex-start; }
  .stub-col .col-label {
    font-size: 11px; font-weight: 650; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
  }
  .stub {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: var(--shadow);
    padding: 8px 12px; width: 200px; cursor: pointer;
  }
  .stub:hover { border-color: var(--sel); }
  .stub .mname { font-size: 12px; }
  .stub .ssum {
    font-size: 11px; color: var(--muted);
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .focus-grid .mod {
    position: static; max-width: none; transition: none;
  }
  .focus-grid .mod .mod-head { cursor: default; }

  #panel {
    position: fixed; right: 18px; top: 74px; width: 320px;
    max-height: calc(100% - 150px); overflow: auto; z-index: 20;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: 0 8px 28px rgba(16,24,40,.18);
  }
  .p-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    font-weight: 650; position: sticky; top: 0; background: var(--card-head);
    border-radius: 12px 12px 0 0;
  }
  #p-close, #p-focus {
    cursor: pointer; border: none; background: none;
    color: var(--muted); font-size: 16px; line-height: 1; padding: 2px 6px;
  }
  #p-focus { margin-left: auto; font-size: 14px; }
  #p-close:hover, #p-focus:hover { color: var(--sel); }
  #p-body { padding: 12px 14px; font-size: 13px; }
  #p-body .p-mod { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  #p-body code {
    display: block; padding: 6px 8px; margin: 4px 0 8px;
    background: var(--card-head); border: 1px solid var(--border); border-radius: 6px;
    font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    overflow-x: auto;
  }
  .p-sec { margin-top: 12px; font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .p-link {
    display: block; width: 100%; text-align: left; cursor: pointer;
    font: 12px/1.4 inherit; color: var(--text);
    background: none; border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 8px; margin-top: 5px;
  }
  .p-link:hover { border-color: var(--sel); }
  .p-link .etype { color: var(--muted); font-size: 11px; }
  .p-link .elabel { color: var(--muted); font-size: 11px; font-style: italic; display: block; }
  .none { font-size: 12px; color: var(--muted); font-style: italic; }

  footer {
    flex: none; display: flex; gap: 18px; align-items: baseline;
    padding: 8px 20px; border-top: 1px solid var(--border);
    background: var(--card); font-size: 12px; color: var(--muted);
  }
  #stamp { margin-left: auto; flex: none; }

  #edgeTip {
    position: fixed; z-index: 30; pointer-events: none;
    background: var(--card); border: 1px solid var(--border); border-radius: 6px;
    box-shadow: var(--shadow); padding: 4px 8px; font-size: 12px; max-width: 320px;
  }
  #fatal { padding: 40px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<script src="./code-map-model.js"></script>
<script src="./elk.bundled.js"></script>

<header>
  <button id="backBtn" hidden>&larr; Canvas</button>
  <div id="titleBlock">
    <h1 id="mapTitle"></h1>
    <div id="mapSubtitle"></div>
    <div id="mapQuestion"></div>
  </div>
  <div id="legend">
    <span class="lg"><i class="sw sw-calls"></i>calls</span>
    <span class="lg"><i class="sw sw-fires"></i>fires &middot; async</span>
    <span class="lg"><i class="sw sw-data"></i>data</span>
    <button id="tidyBtn" title="Re-run automatic layout (discards manual moves)">&#10227; Tidy</button>
  </div>
</header>

<main>
  <section id="canvas" class="view">
    <div class="stage"><svg class="edges"></svg></div>
  </section>
  <section id="focus" class="view" hidden>
    <div class="focus-grid"></div>
    <svg class="edges"></svg>
  </section>
</main>

<aside id="panel" hidden>
  <div class="p-head"><span id="p-title"></span><button id="p-focus" data-tip="Open in focus view">⤢</button><button id="p-close" title="Close">&times;</button></div>
  <div id="p-body"></div>
</aside>

<footer>
  <div id="curation"></div>
  <div id="stamp"></div>
</footer>

<div id="edgeTip" hidden></div>

<script>
(function () {
  'use strict';

  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  function fatal(msg) {
    document.body.innerHTML = '<div id="fatal">code-map: ' + esc(msg) + '</div>';
  }

  var model = window.CODE_MAP_MODEL;
  if (!model) return fatal('missing model — expects code-map-model.js next to this file.');
  if (typeof ELK !== 'function') return fatal('missing elk.bundled.js next to this file.');
  if (!Array.isArray(model.modules)) return fatal('model has no modules array.');

  var meta = model.meta || {};
  var groups = model.groups || [];
  var byId = {};
  model.modules.forEach(function (m) { byId[m.id] = m; });
  var fnsOf = function (m) { return m.functions || []; };
  var fnIn = function (m, fid) {
    return fnsOf(m).find(function (f) { return f.id === fid; }) || null;
  };

  var edges = [];
  (model.edges || []).forEach(function (e) {
    var fp = String(e.from || '').split('.'), tp = String(e.to || '').split('.');
    var fm = byId[fp[0]], tm = byId[tp[0]];
    var ok = fm && tm &&
      (fp.length === 1 || fnIn(fm, fp[1])) &&
      (tp.length === 1 || fnIn(tm, tp[1])) &&
      ['calls', 'fires', 'data'].indexOf(e.type) >= 0;
    if (!ok) { console.warn('code-map: skipping invalid edge', e); return; }
    edges.push({ from: e.from, to: e.to, type: e.type, label: e.label || '',
                 fromMod: fp[0], toMod: tp[0],
                 fromFn: fp[1] || null, toFn: tp[1] || null });
  });

  var frame = model.initialFrame || {};
  var state = {
    open: new Set((frame.expanded || []).filter(function (id) { return byId[id]; })),
    focus: null,
    sel: null
  };
  var moved = new Set();     // modules the user has dragged since the last layout
  var suppressClick = false; // a drag just ended; swallow the click it produced

  var stage = $('.stage'), svg = $('svg.edges', stage), tip = $('#edgeTip');
  var canvasEl = $('#canvas'), focusEl = $('#focus'), backBtn = $('#backBtn');
  var elk = new ELK();
  var PADX = 64, PADY = 30;
  var routes = {};           // edge index -> ELK route points (stage coords)

  document.title = (meta.title || 'code map') + ' · code map';
  $('#mapTitle').textContent = meta.title || 'code map';
  $('#mapSubtitle').textContent = meta.subtitle || '';
  $('#mapQuestion').textContent = meta.question ? 'Q: ' + meta.question : '';
  $('#stamp').textContent =
    [meta.generated, meta.source].filter(Boolean).join(' · ');
  if (meta.curation) {
    var c = meta.curation, parts = [];
    if (c.note) parts.push(c.note);
    if (c.omitted && c.omitted.length) parts.push('omitted: ' + c.omitted.join(', '));
    if (c.reason) parts.push('(' + c.reason + ')');
    $('#curation').textContent = parts.join(' · ');
  } else {
    $('#curation').textContent = 'Full scope — nothing was cut.';
  }

  // ---- cards -----------------------------------------------------------

  var cardEls = {};

  function fnRow(m, f) {
    var row = document.createElement('div');
    row.className = 'fn';
    row.dataset.ep = m.id + '.' + f.id;
    row.innerHTML = '<span class="fname">' + esc(f.name) + '</span>' +
      (f.new ? '<span class="chip-new">NEW</span>' : '');
    row.addEventListener('click', function (ev) {
      ev.stopPropagation();
      if (suppressClick) return;
      state.sel = state.sel === row.dataset.ep ? null : row.dataset.ep;
      renderPanel();
      mark();
    });
    return row;
  }

  function moduleCard(m, opts) {
    opts = opts || {};
    var expanded = opts.alwaysOpen || state.open.has(m.id);
    var card = document.createElement('div');
    card.className = 'mod' + (expanded ? '' : ' closed');
    card.dataset.ep = m.id;

    var hasFns = fnsOf(m).length > 0;
    var expandable = hasFns || !!m.description;
    var head = document.createElement('div');
    head.className = 'mod-head';
    head.innerHTML =
      (!opts.alwaysOpen && expandable
        ? '<span class="chev' + (expanded ? ' open' : '') + '">▸</span>' : '') +
      (m.kind ? '<span class="kind">' + esc(m.kind) + '</span>' : '') +
      '<span class="mname">' + esc(m.name || m.id) + '</span>' +
      (opts.alwaysOpen ? ''
        : '<button class="focus-btn" data-tip="Focus: just this module, its callers &amp; callees">⤢</button>');
    if (!opts.alwaysOpen) {
      if (expandable) {
        head.title = expanded ? 'Collapse' : (hasFns ? 'Expand functions' : 'Expand description');
        head.addEventListener('click', function () {
          if (suppressClick) return;
          state.open.has(m.id) ? state.open.delete(m.id) : state.open.add(m.id);
          rebuildCard(m);
          layout(false);
        });
      }
      $('.focus-btn', head).addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (suppressClick) return;
        setFocus(m.id);
      });
    }
    card.appendChild(head);

    // description subsumes the one-liner, so it replaces rather than stacks
    var blurb = (expanded && m.description) || m.summary;
    if (blurb) {
      var sum = document.createElement('div');
      sum.className = 'mod-sum';
      sum.textContent = blurb;
      card.appendChild(sum);
    }
    if (expanded) fnsOf(m).forEach(function (f) { card.appendChild(fnRow(m, f)); });

    if (!opts.alwaysOpen) makeDraggable(card, m.id);
    return card;
  }

  function buildCards() {
    Object.keys(cardEls).forEach(function (id) { cardEls[id].remove(); });
    cardEls = {};
    model.modules.forEach(function (m) {
      var el = moduleCard(m);
      el.style.visibility = 'hidden';
      stage.appendChild(el);
      cardEls[m.id] = el;
    });
  }

  function rebuildCard(m) {
    var old = cardEls[m.id];
    var el = moduleCard(m);
    el.style.left = old.style.left;
    el.style.top = old.style.top;
    old.replaceWith(el);
    cardEls[m.id] = el;
  }

  // ---- drag ------------------------------------------------------------

  function makeDraggable(card, id) {
    card.addEventListener('pointerdown', function (ev) {
      if (ev.button !== 0) return;
      var sx = ev.clientX, sy = ev.clientY;
      var baseL = card.offsetLeft, baseT = card.offsetTop;
      var dragging = false;

      function onMove(mev) {
        var dx = mev.clientX - sx, dy = mev.clientY - sy;
        if (!dragging && Math.hypot(dx, dy) > 4) {
          dragging = true;
          card.classList.add('dragging');
          try { card.setPointerCapture(ev.pointerId); } catch (e) {}
        }
        if (!dragging) return;
        card.style.left = Math.max(6, baseL + dx) + 'px';
        card.style.top = Math.max(6, baseT + dy) + 'px';
        moved.add(id);
        requestAnimationFrame(drawEdges);
      }
      function onUp() {
        card.removeEventListener('pointermove', onMove);
        card.removeEventListener('pointerup', onUp);
        card.removeEventListener('pointercancel', onUp);
        if (!dragging) return;
        card.classList.remove('dragging');
        suppressClick = true;
        setTimeout(function () { suppressClick = false; }, 0);
        fitStage();
        drawEdges();
      }
      card.addEventListener('pointermove', onMove);
      card.addEventListener('pointerup', onUp);
      card.addEventListener('pointercancel', onUp);
    });
  }

  // ---- ELK -------------------------------------------------------------

  var partOf = function (m) {
    var i = groups.findIndex(function (g) { return g.id === m.group; });
    return i < 0 ? groups.length : i;
  };

  // Port id for a function endpoint; only expanded rows become ports —
  // collapsed modules take their edges at the card border.
  function portId(mod, fn, dir) { return 'p_' + mod + '_' + fn + '_' + dir; }

  function endpointId(mod, fn, dir) {
    if (fn && state.open.has(mod)) return portId(mod, fn, dir);
    return mod;
  }

  function elkGraph(firstRun) {
    var portsByMod = {};
    edges.forEach(function (e) {
      if (e.fromMod === e.toMod) return; // self edges drawn by hand
      if (e.fromFn && state.open.has(e.fromMod)) {
        (portsByMod[e.fromMod] = portsByMod[e.fromMod] || {})[portId(e.fromMod, e.fromFn, 'out')] =
          { fn: e.fromFn, side: 'EAST' };
      }
      if (e.toFn && state.open.has(e.toMod)) {
        (portsByMod[e.toMod] = portsByMod[e.toMod] || {})[portId(e.toMod, e.toFn, 'in')] =
          { fn: e.toFn, side: 'WEST' };
      }
    });

    var children = model.modules.map(function (m) {
      var el = cardEls[m.id];
      var node = {
        id: m.id,
        width: el.offsetWidth,
        height: el.offsetHeight,
        layoutOptions: { 'elk.partitioning.partition': String(partOf(m)) }
      };
      if (!firstRun) { node.x = el.offsetLeft - PADX; node.y = el.offsetTop - PADY; }

      var pmap = portsByMod[m.id];
      if (pmap) {
        node.layoutOptions['elk.portConstraints'] = 'FIXED_POS';
        node.ports = Object.keys(pmap).map(function (pid) {
          var p = pmap[pid];
          var row = $('[data-ep="' + CSS.escape(m.id + '.' + p.fn) + '"]', el);
          var y = row ? row.offsetTop + row.offsetHeight / 2 : node.height / 2;
          return {
            id: pid,
            x: p.side === 'EAST' ? node.width : 0,
            y: y,
            layoutOptions: { 'elk.port.side': p.side }
          };
        });
      }
      return node;
    });

    var elkEdges = [];
    edges.forEach(function (e, i) {
      if (e.fromMod === e.toMod) return;
      elkEdges.push({
        id: 'e' + i,
        sources: [endpointId(e.fromMod, e.fromFn, 'out')],
        targets: [endpointId(e.toMod, e.toFn, 'in')]
      });
    });

    return {
      id: 'root',
      layoutOptions: {
        'elk.algorithm': 'layered',
        'elk.direction': 'DOWN',
        'elk.edgeRouting': 'ORTHOGONAL',
        'elk.partitioning.activate': 'true',
        'elk.spacing.nodeNode': '36',
        'elk.layered.spacing.nodeNodeBetweenLayers': '64',
        'elk.spacing.edgeNode': '18',
        'elk.spacing.edgeEdge': '14',
        'elk.layered.spacing.edgeNodeBetweenLayers': '28',
        // re-runs keep the user's arrangement recognizable instead of reshuffling
        'elk.layered.cycleBreaking.strategy': firstRun ? 'GREEDY' : 'INTERACTIVE',
        'elk.layered.crossingMinimization.strategy': firstRun ? 'LAYER_SWEEP' : 'INTERACTIVE'
      },
      children: children,
      edges: elkEdges
    };
  }

  var layoutBusy = false;
  function layout(firstRun) {
    if (layoutBusy) return;
    layoutBusy = true;
    svg.classList.add('dim');
    elk.layout(elkGraph(firstRun)).then(function (res) {
      res.children.forEach(function (n) {
        var el = cardEls[n.id];
        el.style.left = (n.x + PADX) + 'px';
        el.style.top = (n.y + PADY) + 'px';
        el.style.visibility = '';
      });
      routes = {};
      (res.edges || []).forEach(function (e) {
        var s = e.sections && e.sections[0];
        if (!s) return;
        routes[+e.id.slice(1)] =
          [s.startPoint].concat(s.bendPoints || [], [s.endPoint]).map(function (p) {
            return { x: p.x + PADX, y: p.y + PADY };
          });
      });
      moved.clear();
      // let the position transition finish before edges reappear; the second
      // pass re-reads geometry in case transitions or fonts lagged the first
      var settle = function () {
        fitStage();
        placeLayerLabels();
        drawEdges();
        svg.classList.remove('dim');
        layoutBusy = false;
      };
      setTimeout(settle, firstRun ? 0 : 270);
      if (!firstRun) setTimeout(settle, 700);
    }).catch(function (err) {
      layoutBusy = false;
      svg.classList.remove('dim');
      fatal('ELK layout failed: ' + err.message);
    });
  }

  function fitStage() {
    var w = 0, h = 0;
    Object.keys(cardEls).forEach(function (id) {
      var el = cardEls[id];
      w = Math.max(w, el.offsetLeft + el.offsetWidth);
      h = Math.max(h, el.offsetTop + el.offsetHeight);
    });
    stage.style.width = (w + PADX) + 'px';
    stage.style.height = (h + 80) + 'px';
  }

  function placeLayerLabels() {
    Array.prototype.forEach.call(stage.querySelectorAll('.layer-label'), function (el) { el.remove(); });
    groups.forEach(function (g) {
      var minY = Infinity;
      model.modules.forEach(function (m) {
        if (m.group !== g.id) return;
        minY = Math.min(minY, cardEls[m.id].offsetTop);
      });
      if (minY === Infinity) return;
      var lab = document.createElement('div');
      lab.className = 'layer-label';
      lab.textContent = g.label || g.id;
      lab.style.top = (minY - 20) + 'px';
      stage.appendChild(lab);
    });
  }

  // ---- edges -----------------------------------------------------------

  var DEFS =
    '<defs>' +
    ['calls', 'fires', 'data'].map(function (t) {
      return '<marker id="arr-' + t + '" viewBox="0 0 10 10" refX="8.5" refY="5" ' +
        'markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">' +
        '<path d="M0,0L10,5L0,10z" class="mk-' + t + '"/></marker>';
    }).join('') +
    '</defs>';

  function roundedPath(pts, rad) {
    var d = 'M ' + pts[0].x + ' ' + pts[0].y;
    for (var i = 1; i < pts.length - 1; i++) {
      var p = pts[i], prev = pts[i - 1], next = pts[i + 1];
      var l1 = Math.hypot(p.x - prev.x, p.y - prev.y) || 1;
      var l2 = Math.hypot(next.x - p.x, next.y - p.y) || 1;
      var r = Math.min(rad, l1 / 2, l2 / 2);
      d += ' L ' + (p.x - (p.x - prev.x) / l1 * r) + ' ' + (p.y - (p.y - prev.y) / l1 * r) +
           ' Q ' + p.x + ' ' + p.y + ' ' +
           (p.x + (next.x - p.x) / l2 * r) + ' ' + (p.y + (next.y - p.y) / l2 * r);
    }
    var last = pts[pts.length - 1];
    return d + ' L ' + last.x + ' ' + last.y;
  }

  // Rect of an endpoint (fn row when visible, else the card), in stage coords.
  function endpointRect(mod, fn) {
    var el = null;
    if (fn && state.open.has(mod)) {
      el = $('[data-ep="' + CSS.escape(mod + '.' + fn) + '"]', cardEls[mod]);
    }
    el = el || cardEls[mod];
    var r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
    return { x: r.left - s.left, y: r.top - s.top, w: r.width, h: r.height };
  }

  function sideAnchor(r, toRight) {
    return toRight
      ? { x: r.x + r.w, y: r.y + r.h / 2, nx: 1 }
      : { x: r.x, y: r.y + r.h / 2, nx: -1 };
  }

  // Simple curve for edges touching a dragged card — no obstacle avoidance,
  // that's the price of manual placement until the next Tidy.
  function fallbackCurve(e) {
    var r1 = endpointRect(e.fromMod, e.fromFn), r2 = endpointRect(e.toMod, e.toFn);
    var c1 = r1.x + r1.w / 2, c2 = r2.x + r2.w / 2;
    var p1 = sideAnchor(r1, c2 >= c1), p2 = sideAnchor(r2, c1 > c2);
    var k = Math.min(80, Math.max(28, Math.hypot(p2.x - p1.x, p2.y - p1.y) / 3));
    return 'M ' + p1.x + ' ' + p1.y +
      ' C ' + (p1.x + p1.nx * k) + ' ' + p1.y + ', ' +
              (p2.x + p2.nx * k) + ' ' + p2.y + ', ' +
              p2.x + ' ' + p2.y;
  }

  function selfLoop(e) {
    var r1 = endpointRect(e.fromMod, e.fromFn), r2 = endpointRect(e.toMod, e.toFn);
    var d0 = Math.max(12, Math.min(40, r1.x - 8));
    var y1 = r1.y + r1.h / 2, y2 = r2.y + r2.h / 2;
    return 'M ' + r1.x + ' ' + y1 + ' C ' + (r1.x - d0) + ' ' + y1 + ', ' +
           (r2.x - d0) + ' ' + y2 + ', ' + r2.x + ' ' + y2;
  }

  var SVGNS = 'http://www.w3.org/2000/svg';

  function addEdgePath(svgEl, d, e) {
    var vis = document.createElementNS(SVGNS, 'path');
    vis.setAttribute('d', d);
    vis.setAttribute('class', 'edge e-' + e.type);
    vis.setAttribute('marker-end', 'url(#arr-' + e.type + ')');
    svgEl.appendChild(vis);

    var hit = document.createElementNS(SVGNS, 'path');
    hit.setAttribute('d', d);
    hit.setAttribute('class', 'hit');
    hit.addEventListener('pointerenter', function () {
      vis.classList.add('hot');
      tip.textContent = e.type + (e.label ? ' — ' + e.label : '');
      tip.hidden = false;
    });
    hit.addEventListener('pointermove', function (ev) {
      tip.style.left = (ev.clientX + 14) + 'px';
      tip.style.top = (ev.clientY + 14) + 'px';
    });
    hit.addEventListener('pointerleave', function () {
      vis.classList.remove('hot');
      tip.hidden = true;
    });
    svgEl.appendChild(hit);
  }

  function drawEdges() {
    svg.setAttribute('width', stage.offsetWidth);
    svg.setAttribute('height', stage.offsetHeight);
    svg.innerHTML = DEFS;

    edges.forEach(function (e, i) {
      var d;
      if (e.fromMod === e.toMod) {
        // internal edge: only meaningful while the card shows its fn rows
        if (!state.open.has(e.fromMod)) return;
        d = selfLoop(e);
      }
      else if (moved.has(e.fromMod) || moved.has(e.toMod) || !routes[i]) d = fallbackCurve(e);
      else d = roundedPath(routes[i], 10);
      addEdgePath(svg, d, e);
    });
  }

  function mark() {
    Array.prototype.forEach.call(document.querySelectorAll('.fn.sel'), function (el) {
      el.classList.remove('sel');
    });
    if (!state.sel) return;
    var el = $('[data-ep="' + CSS.escape(state.sel) + '"]', state.focus ? focusEl : stage);
    if (el) el.classList.add('sel');
  }

  // ---- focus view ------------------------------------------------------

  function stub(m, side) {
    var el = document.createElement('div');
    el.className = 'stub';
    if (side === 'l') el.dataset.stubL = m.id; else el.dataset.stubR = m.id;
    el.innerHTML =
      '<div class="mod-head" style="background:none;padding:0;cursor:pointer">' +
      (m.kind ? '<span class="kind">' + esc(m.kind) + '</span>' : '') +
      '<span class="mname">' + esc(m.name || m.id) + '</span></div>' +
      (m.summary ? '<div class="ssum">' + esc(m.summary) + '</div>' : '');
    el.addEventListener('click', function (ev) {
      ev.stopPropagation();
      setFocus(m.id);
    });
    return el;
  }

  function buildFocus(id) {
    var m = byId[id];
    var grid = $('.focus-grid', focusEl);
    grid.innerHTML = '';

    var callerIds = [], calleeIds = [];
    edges.forEach(function (e) {
      if (e.toMod === id && e.fromMod !== id && callerIds.indexOf(e.fromMod) < 0) callerIds.push(e.fromMod);
      if (e.fromMod === id && e.toMod !== id && calleeIds.indexOf(e.toMod) < 0) calleeIds.push(e.toMod);
    });

    var left = document.createElement('div');
    left.className = 'stub-col left';
    left.innerHTML = '<div class="col-label">called by</div>';
    if (callerIds.length) callerIds.forEach(function (cid) { left.appendChild(stub(byId[cid], 'l')); });
    else left.insertAdjacentHTML('beforeend', '<div class="none">no callers in map</div>');

    var center = document.createElement('div');
    center.appendChild(moduleCard(m, { alwaysOpen: true }));

    var right = document.createElement('div');
    right.className = 'stub-col right';
    right.innerHTML = '<div class="col-label">calls into</div>';
    if (calleeIds.length) calleeIds.forEach(function (cid) { right.appendChild(stub(byId[cid], 'r')); });
    else right.insertAdjacentHTML('beforeend', '<div class="none">no callees in map</div>');

    grid.appendChild(left);
    grid.appendChild(center);
    grid.appendChild(right);
  }

  // Rect relative to a scrollable view (the focus section).
  function rectIn(view, el) {
    var r = el.getBoundingClientRect(), h = view.getBoundingClientRect();
    return { x: r.left - h.left + view.scrollLeft, y: r.top - h.top + view.scrollTop,
             w: r.width, h: r.height };
  }

  function drawFocusEdges() {
    var svgF = $('svg.edges', focusEl);
    svgF.setAttribute('width', focusEl.scrollWidth);
    svgF.setAttribute('height', focusEl.scrollHeight);
    svgF.innerHTML = DEFS;
    var id = state.focus;
    if (!id) return;

    edges.forEach(function (e) {
      if (e.fromMod !== id && e.toMod !== id) return;

      var a = e.fromMod === id
        ? $('[data-ep="' + CSS.escape(e.from) + '"]', focusEl) || $('[data-ep="' + CSS.escape(id) + '"]', focusEl)
        : $('[data-stub-l="' + CSS.escape(e.fromMod) + '"]', focusEl);
      var b = e.toMod === id
        ? $('[data-ep="' + CSS.escape(e.to) + '"]', focusEl) || $('[data-ep="' + CSS.escape(id) + '"]', focusEl)
        : $('[data-stub-r="' + CSS.escape(e.toMod) + '"]', focusEl);
      if (!a || !b || a === b) return;

      var r1 = rectIn(focusEl, a), r2 = rectIn(focusEl, b), d;
      if (e.fromMod === e.toMod) {
        // internal edge: loop out the left side of the center card
        var d0 = Math.max(12, Math.min(40, r1.x - 8));
        d = 'M ' + r1.x + ' ' + (r1.y + r1.h / 2) +
            ' C ' + (r1.x - d0) + ' ' + (r1.y + r1.h / 2) + ', ' +
                    (r2.x - d0) + ' ' + (r2.y + r2.h / 2) + ', ' +
                    r2.x + ' ' + (r2.y + r2.h / 2);
      } else {
        var p1 = sideAnchor(r1, r2.x + r2.w / 2 >= r1.x + r1.w / 2);
        var p2 = sideAnchor(r2, r1.x + r1.w / 2 > r2.x + r2.w / 2);
        var k = Math.min(80, Math.max(28, Math.hypot(p2.x - p1.x, p2.y - p1.y) / 3));
        d = 'M ' + p1.x + ' ' + p1.y +
            ' C ' + (p1.x + p1.nx * k) + ' ' + p1.y + ', ' +
                    (p2.x + p2.nx * k) + ' ' + p2.y + ', ' +
                    p2.x + ' ' + p2.y;
      }
      addEdgePath(svgF, d, e);
    });
  }

  // Hash-based (#focus=id): query rewrites via pushState throw on file:// pages.
  function setFocus(id) {
    if (state.focus === id) return;
    location.hash = 'focus=' + id;
  }
  function exitFocus() {
    if (state.focus) location.hash = '';
  }
  function applyHash() {
    var m = location.hash.match(/focus=([A-Za-z0-9_]+)/);
    state.focus = (m && byId[m[1]]) ? m[1] : null;
    canvasEl.hidden = !!state.focus;
    focusEl.hidden = !state.focus;
    backBtn.hidden = !state.focus;
    if (state.focus) {
      buildFocus(state.focus);
      requestAnimationFrame(drawFocusEdges);
    } else {
      // canvas geometry reads as zero while hidden — refresh it on return
      requestAnimationFrame(function () { fitStage(); placeLayerLabels(); drawEdges(); });
    }
    renderPanel();
    mark();
  }

  // ---- detail panel ----------------------------------------------------

  var panel = $('#panel');

  function displayName(ep) {
    var p = ep.split('.'), m = byId[p[0]];
    if (!m) return ep;
    if (p.length === 1) return m.name || m.id;
    var f = fnIn(m, p[1]);
    return (m.name || m.id) + ' · ' + (f ? f.name : p[1]);
  }

  function edgeLinks(list, side) {
    if (!list.length) return '<div class="none">none in map</div>';
    return list.map(function (e) {
      var other = side === 'out' ? e.to : e.from;
      return '<button class="p-link" data-ep="' + esc(other) + '">' +
        esc(displayName(other)) + ' <span class="etype">' + e.type + '</span>' +
        (e.label ? '<span class="elabel">' + esc(e.label) + '</span>' : '') +
        '</button>';
    }).join('');
  }

  function renderPanel() {
    if (!state.sel || state.sel.indexOf('.') < 0) { panel.hidden = true; return; }
    var p = state.sel.split('.'), m = byId[p[0]], f = m && fnIn(m, p[1]);
    if (!f) { panel.hidden = true; return; }

    var calls = edges.filter(function (e) { return e.from === state.sel; });
    var calledBy = edges.filter(function (e) { return e.to === state.sel; });

    $('#p-title').innerHTML = esc(f.name) +
      (f.new ? ' <span class="chip-new">NEW</span>' : '');
    $('#p-body').innerHTML =
      '<div class="p-mod">' + esc(m.name || m.id) + '</div>' +
      (f.sig ? '<code>' + esc(f.sig) + '</code>' : '') +
      (f.summary ? '<div>' + esc(f.summary) + '</div>' : '') +
      '<div class="p-sec">calls</div>' + edgeLinks(calls, 'out') +
      '<div class="p-sec">called by</div>' + edgeLinks(calledBy, 'in');

    Array.prototype.forEach.call(panel.querySelectorAll('.p-link'), function (btn) {
      btn.addEventListener('click', function () { navTo(btn.dataset.ep); });
    });
    $('#p-focus').hidden = state.focus === p[0]; // already focused there
    panel.hidden = false;
  }

  function navTo(ep) {
    var mod = ep.split('.')[0];
    if (!byId[mod]) return;
    state.sel = ep;
    if (state.focus && state.focus !== mod) { setFocus(mod); return; } // applyHash picks up sel
    if (state.focus) { renderPanel(); mark(); return; } // focused card always shows its rows
    var needsLayout = ep.indexOf('.') >= 0 && !state.open.has(mod);
    if (needsLayout) {
      state.open.add(mod);
      rebuildCard(byId[mod]);
      layout(false);
    }
    renderPanel();
    mark();
    // scroll once any relayout has settled
    setTimeout(function () {
      var el = $('[data-ep="' + CSS.escape(ep) + '"]', stage);
      if (el) el.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
    }, needsLayout ? 320 : 0);
  }

  // ---- wiring / boot ---------------------------------------------------

  $('#tidyBtn').addEventListener('click', function () {
    if (state.focus) return; // canvas is hidden; its geometry can't be measured
    layout(true);
  });
  $('#p-close').addEventListener('click', function () {
    state.sel = null; renderPanel(); mark();
  });
  $('#p-focus').addEventListener('click', function () {
    if (state.sel) setFocus(state.sel.split('.')[0]);
  });
  backBtn.addEventListener('click', exitFocus);
  window.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    if (state.sel) { state.sel = null; renderPanel(); mark(); }
    else exitFocus();
  });
  // clicking empty canvas background deselects
  $('#canvas').addEventListener('click', function (ev) {
    if (suppressClick) return;
    if (ev.target === stage || ev.target.id === 'canvas' || ev.target === svg) {
      state.sel = null; renderPanel(); mark();
    }
  });
  window.addEventListener('hashchange', applyHash);
  window.addEventListener('resize', function () {
    requestAnimationFrame(state.focus ? drawFocusEdges : drawEdges);
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      requestAnimationFrame(state.focus ? drawFocusEdges : drawEdges);
    });
  }

  buildCards();
  layout(true);
  if (!location.hash && frame.focus && byId[frame.focus]) {
    try { history.replaceState(null, '', '#focus=' + frame.focus); } catch (e) {}
  }
  if (location.hash) applyHash();
})();
</script>
</body>
</html>
